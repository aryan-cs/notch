name: Feature request
description: Suggest something new for Notch, or a better way to do something it already does.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem you're running into, or what you wish Notch could help with.
      placeholder: "I keep missing meetings when I'm working in full screen…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Notch help?
      description: Describe what you imagine. Mockups and screenshots are welcome; you can drag them in here.
      placeholder: "The closed notch could show a countdown when a meeting is about to start."
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this hasn't been suggested yet.
          required: true
