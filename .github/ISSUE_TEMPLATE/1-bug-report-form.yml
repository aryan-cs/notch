name: Bug report
description: Something in Notch isn't working the way it should.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The quickest way to fill in the version fields is **Report a Bug** in Notch's **Settings → About**.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and how to make it happen again. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notch version
      description: Shown in Settings → About.
      placeholder: "1.0.1 (build 2)"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
    validations:
      required: true
  - type: dropdown
    id: music-source
    attributes:
      label: Music source
      description: Only if the problem is with music. It's set in Settings → Media.
      options:
        - Now Playing
        - Apple Music
        - Spotify
        - YouTube Music
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        If you have them, paste messages from Console.app filtered to
        theboringteam.boringnotch. They're formatted as code for you.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
